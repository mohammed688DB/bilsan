<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>بيلسان الريف المتحدة</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#1d2a22;--mute:#6b7a70;--line:#dfe5df;--pri:#2f6b4f;--pri2:#e5f0ea;--ok:#1f8a4c;--okbg:#e3f5ea;--bad:#b3261e;--badbg:#fbe9e7;--warn:#a86400;--warnbg:#fff3df;--sh:0 1px 3px rgba(0,0,0,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--card:#1b221e;--ink:#e6ece8;--mute:#93a39a;--line:#2c3630;--pri:#5cb38a;--pri2:#21352b;--ok:#5cc98a;--okbg:#1d3326;--bad:#ff8a80;--badbg:#3a1f1d;--warn:#ffb74d;--warnbg:#3a2c16;--sh:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI",Tahoma,Arial,sans-serif;overflow-x:clip}
header{background:var(--pri);color:#fff;padding:14px 16px 0}
@media (prefers-color-scheme:dark){header{background:#1e3a2c}}
header h1{margin:0;font-size:20px}
header .sub{opacity:.8;font-size:13px}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav button{background:none;border:0;color:#fff;opacity:.75;padding:9px 14px;font:inherit;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
nav button.on{background:var(--bg);color:var(--ink);opacity:1;font-weight:600}
main{max-width:1250px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:var(--sh);min-width:0}
.card h2{margin:0 0 10px;font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile .k{color:var(--mute);font-size:13px}.tile .v{font-size:22px;font-weight:700;margin-top:2px}.tile .s{font-size:12px;color:var(--mute)}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--pri)}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){button.p{color:#0d1a13}}
button.d{color:var(--bad)}
button.sm{padding:3px 9px;font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 7px;text-align:right;white-space:nowrap}
th{background:var(--pri2);font-weight:600;position:sticky;top:0}
tfoot td{font-weight:700;background:var(--pri2)}
td.n,th.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
td input{width:72px;padding:3px 5px}
td input.w{width:48px}
#main th,#main td{padding:6px 5px}
.ltr{direction:ltr;unicode-bidi:isolate}
.tag{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12px;font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.mu{background:var(--line);color:var(--mute)}
.note{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
.info{background:var(--pri2);border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
.mute{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:30px}
dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--ink);width:min(560px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog.wide{width:min(1250px,96vw)}
.bankpv th,.bankpv td{text-align:left;border:1px solid var(--line);padding:9px 8px;font-size:13px}
.bankpv th{background:var(--bg);font-weight:500;white-space:normal;min-width:48px}
.bankpv .r{text-align:right}.bankpv .b{font-weight:700}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .hd{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700}
dialog .bd{padding:14px 16px;max-height:70vh;overflow:auto}
dialog .ft{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute);min-width:0}
.fg label.full{grid-column:1/-1}
.fg label input,.fg label select,.fg label textarea{color:var(--ink);font-size:15px}
@media (max-width:560px){.fg{grid-template-columns:1fr}main{padding:10px}}
.bar{height:10px;border-radius:5px;background:var(--pri)}
.bar.e{background:var(--bad)}
.badge{display:inline-block;min-width:19px;padding:0 5px;border-radius:10px;background:#d93025;color:#fff;font-size:12px;font-weight:700;line-height:19px;text-align:center}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;border-radius:9px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
#toast.on{opacity:1}
footer{text-align:center;color:var(--mute);font-size:12px;padding:18px}
</style>
</head>
<body>
<header>
  <h1 id="coName">بيلسان الريف المتحدة</h1>
  <div class="sub">الرواتب · الأرباح · المصروفات · الأعمال — يعمل بدون إنترنت</div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<footer>البيانات محفوظة على هذا الجهاز فقط — خذ نسخة احتياطية من «الإعدادات والنسخ» بشكل دوري.</footer>
<dialog id="dlg"><div class="hd" id="dlgT"></div><div class="bd" id="dlgB"></div><div class="ft" id="dlgF"></div></dialog>
<div id="toast"></div>
<iframe id="pf" style="display:none"></iframe>
<input type="file" id="fileIn" style="display:none">

const WPS_HEAD=['Employee ID Type','Employee ID','Reference Number','Employee Name','Employee BIC Code','Employee Account','Salary Frequency','Number of Working days','Net Salary','Basic Salary','Extra hours','Extra income','Deductions','Social Security Deductions','Notes / Comments'];

const bicOf=(bank,own)=>String(own||'').trim().toUpperCase()||(BICS.find(([re])=>re.test(String(bank||'')))||[,''])[1];
const idCode=t=>DB.settings.idCode==='text'?String(t||''):/pass/i.test(t)?'P':'C';

const money=x=>r3(x).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3});
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const curMonth=()=>today().slice(0,7);

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

/* ================= التخزين (IndexedDB على الجهاز + نسخة في localStorage) ================= */
const KEY='bilsan_db_v1';
let DB=null,idb=null;
function idbOpen(){return new Promise(res=>{try{const q=indexedDB.open('bilsan_db',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}})}
function idbGet(k){return new Promise(res=>{if(!idb)return res(null);try{const q=idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})}
function idbSet(k,v){return new Promise(res=>{if(!idb)return res();try{const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
function save(){DB.updated=Date.now();const s=JSON.stringify(DB);idbSet('db',s);try{localStorage.setItem(KEY,s)}catch(e){}
  if(FH&&fhOk){clearTimeout(save.t);save.t=setTimeout(writeFile,600)}}
/* حفظ تلقائي إضافي في ملف على قرص الجهاز (للكمبيوتر — Edge/Chrome) */
let FH=null,fhOk=false,fhLast=0;
async function writeFile(){try{const w=await FH.createWritable();await w.write(JSON.stringify(DB));await w.close();fhLast=Date.now()}catch(e){fhOk=false;render()}}
async function pickSaveFile(){
  if(!window.showSaveFilePicker)return alert('هذا المتصفح لا يدعم الحفظ في ملف. البيانات محفوظة في ذاكرة الجهاز داخل المتصفح، وخذ نسخة احتياطية يدوياً.');
  try{FH=await showSaveFilePicker({suggestedName:'بيانات بيلسان الريف المتحدة.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]})}catch(e){return}
  await idbSet('fileH',FH);fhOk=true;await writeFile();render();toast('سيُحفظ كل تعديل في الملف تلقائياً');
}
async function relinkFile(){try{fhOk=(await FH.requestPermission({mode:'readwrite'}))==='granted'}catch(e){fhOk=false}if(fhOk)await writeFile();render()}
async function stopFile(){FH=null;fhOk=false;await idbSet('fileH',null);render()}
function blank(){return{v:1,updated:0,settings:{company:'بيلسان الريف المتحدة',dedMode:'neg',lastBackup:0},emps:[],payroll:{},profits:{},expenses:[],works:[],docs:[],invoices:[]}}
function seedDB(){
  const d=blank();
  const m=curMonth(),rows=[];
  (SEED&&SEED.emps||[]).forEach(e=>{
    const emp={id:uid(),name:e.name,idType:e.idType,idNo:e.idNo,bank:e.bank,acct:e.acct,basic:e.basic,ss:e.ss,hourRate:0,fee:0,phone:'',active:true,notes:''};
    d.emps.push(emp);
    rows.push({...snap(emp),days:e.days,hours:e.hours,basic:e.basic,extra:e.extra,ded:e.ded,ss:e.ss,paid:false});
  });
  if(rows.length)d.payroll[m]={rows,created:Date.now()};
  return d;
}
async function boot(){
  idb=await idbOpen();
  try{FH=await idbGet('fileH');if(FH)fhOk=(await FH.queryPermission({mode:'readwrite'}))==='granted'}catch(e){FH=null}
  let s=await idbGet('db');
  if(!s){try{s=localStorage.getItem(KEY)}catch(e){}}
  DB=s?JSON.parse(s):seedDB();
  DB.settings=Object.assign(blank().settings,DB.settings||{});DB.docs=DB.docs||[];
  if(!s)save();
  fixes();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  render();
  /* تنبيه انتهاء الوثائق عند فتح التطبيق — مرة واحدة في اليوم */
  if(allAlerts().length&&DB.settings.alertShown!==today()){DB.settings.alertShown=today();save();showAlerts()}
}

/* ================= مساعدات البيانات ================= */
const emp=id=>DB.emps.find(e=>e.id===id);
const snap=e=>({emp:e.id,name:e.name,idType:e.idType,idNo:e.idNo,bank:e.bank,acct:e.acct,bic:e.bic||'',ref:e.ref||''});
const net=r=>r3((+r.basic||0)+(+r.extra||0)-(+r.ded||0)-(+r.ss||0));
function payTot(m){const p=DB.payroll[m];const t={n:0,basic:0,extra:0,ded:0,ss:0,net:0,paid:0};if(!p)return t;p.rows.forEach(r=>{t.n++;t.basic+=+r.basic||0;t.extra+=+r.extra||0;t.ded+=+r.ded||0;t.ss+=+r.ss||0;t.net+=net(r);if(r.paid)t.paid+=net(r)});return t}
function profTot(m){const l=DB.profits[m]||[];let all=0,paid=0;l.forEach(r=>{all+=+r.amount||0;if(r.paid)paid+=+r.amount||0});return{all,paid,rest:all-paid,n:l.length}}
const expIn=m=>DB.expenses.filter(x=>(x.date||'').startsWith(m));
const workIn=m=>DB.works.filter(x=>(x.date||'').startsWith(m));
function uniq(a){return[...new Set(a.filter(Boolean))]}
/* وثائق العامل وتواريخ انتهائها — التنبيه قبل الانتهاء بـ alertDays يوم (افتراضي 30 = شهر) */
const DOCS=[['res','الإقامة'],['civil','البطاقة المدنية'],['labour','بطاقة العمل'],['ins','التأمين الصحي']];
const daysTo=d=>d?Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5):null;
const alertDays=()=>+DB.settings.alertDays||30;
const leftTxt=n=>n<0?`منتهية منذ ${-n} يوم`:n===0?'تنتهي اليوم':`باقي ${n} يوم`;
function expAlerts(){const o=[];DB.emps.filter(e=>e.active).forEach(e=>DOCS.forEach(([k,t])=>{const d=(e.exp||{})[k],n=daysTo(d);if(n!=null&&n<=alertDays())o.push({who:e.name,ltr:1,sub:e.profession,t,d,n,act:`renewForm('${e.id}','${k}')`})}));return o.sort((a,b)=>a.n-b.n)}
function coAlerts(){const o=[];(DB.docs||[]).filter(x=>!x.closed).forEach(x=>{const n=daysTo(x.expiry);if(n!=null&&n<=alertDays()){const e=x.emp&&emp(x.emp);o.push({who:e?e.name:DB.settings.company,ltr:!!e,sub:x.number?'رقم '+x.number:'',t:x.type,d:x.expiry,n,act:`docRenew('${x.id}')`})}});return o.sort((a,b)=>a.n-b.n)}
const allAlerts=()=>[...coAlerts(),...expAlerts()].sort((a,b)=>a.n-b.n);
const docTag=d=>{const n=daysTo(d);if(n==null)return'<span class="mute">—</span>';return`<span class="tag ${n<0?'bad':n<=alertDays()?'warn':'ok'}" title="${leftTxt(n)}">${d}</span>`};
function addYears(d,y){const x=new Date((d||today())+'T00:00:00');x.setFullYear(x.getFullYear()+y);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())}

function docExpense(x,amount,payer,kind){
  const e=x.emp&&emp(x.emp),id=uid();
  DB.expenses.push({id,type:(kind||'تجديد')+' '+x.type,amount:r3(amount),payer:payer||'',date:today(),recipient:x.issuer||'',notes:[x.number?'رقم '+x.number:'',e?e.name:''].filter(Boolean).join(' — '),doc:x.id});
  return id;
}
function docRenew(id){

   <label>تاريخ الانتهاء الجديد<input name="nd" type="date" value="${addYears(base,1)}"></label>
   <label>مبلغ التجديد<input name="cost" type="number" step="0.001" value="${x.amount||''}"></label>

   <div class="info">مبلغ التجديد يُسجَّل تلقائياً في «المصروفات» باسم «تجديد ${esc(x.type)}».</div>${dl('dlEP',DB.expenses.map(e=>e.payer))}`,
  [['حفظ التجديد','p',()=>{

  }],['إلغاء']]);

/* ربط العامل بالنظام: أي إضافة/تعديل/إيقاف ينعكس على كشوف الرواتب والأرباح للشهر الحالي وما بعده (غير المصروفة فقط) — الأشهر السابقة لا تتغير */
/* فحص تلقائي عند كل عرض: كل عامل نشط موجود في كشف رواتب وأرباح الشهر الحالي وما بعده (إلا من أزلته يدوياً من ذلك الشهر)،
   وبيانات البنك في الصفوف غير المصروفة مطابقة لبيانات العامل الحالية */
function autoSync(){
  if(!DB)return;const cm=curMonth();let ch=false;DB.profRemoved=DB.profRemoved||{};
  Object.keys(DB.payroll).filter(m=>m>=cm).forEach(m=>{const p=DB.payroll[m],rm=p.removed||[];
    DB.emps.filter(e=>e.active&&!rm.includes(e.id)).forEach(e=>{const r=p.rows.find(x=>x.emp===e.id);
      if(!r){p.rows.push({...snap(e),days:30,hours:0,basic:e.basic||0,extra:0,ded:0,ss:e.ss||0,paid:false});ch=true}
      else if(!r.paid){const s=snap(e);if(Object.keys(s).some(k=>r[k]!==s[k])){Object.assign(r,s);ch=true}}})});
  Object.keys(DB.profits).filter(m=>m>=cm).forEach(m=>{const l=DB.profits[m],rm=DB.profRemoved[m]||[];
    DB.emps.filter(e=>e.active&&!rm.includes(e.id)).forEach(e=>{const r=l.find(x=>x.emp===e.id);
      if(!r){l.push({id:uid(),emp:e.id,name:e.name,idNo:e.idNo,amount:e.fee||0,notes:'',paid:false,payDate:''});ch=true}
      else if(!r.paid&&(r.name!==e.name||r.idNo!==e.idNo)){r.name=e.name;r.idNo=e.idNo;ch=true}})});
  if(ch)save();
}

function syncEmp(e,old){
  const cm=curMonth(),done=[];
  Object.keys(DB.payroll).filter(m=>m>=cm).forEach(m=>{
    const rows=DB.payroll[m].rows,i=rows.findIndex(r=>r.emp===e.id),r=rows[i];
    if(e.active&&!r){rows.push({...snap(e),days:30,hours:0,basic:e.basic||0,extra:0,ded:0,ss:e.ss||0,paid:false});done.push('أُضيف لكشف رواتب '+mName(m))}
    else if(e.active&&r&&!r.paid){Object.assign(r,snap(e));if(old&&r3(r.basic)===r3(old.basic))r.basic=e.basic||0;if(old&&r3(r.ss)===r3(old.ss))r.ss=e.ss||0;if(old)done.push('حُدّث كشف '+mName(m))}
    else if(!e.active&&r&&!r.paid){rows.splice(i,1);done.push('أُزيل من كشف '+mName(m))}
  });
  Object.keys(DB.profits).filter(m=>m>=cm).forEach(m=>{
    const l=DB.profits[m],i=l.findIndex(r=>r.emp===e.id),r=l[i];
    if(e.active&&!r)l.push({id:uid(),emp:e.id,name:e.name,idNo:e.idNo,amount:e.fee||0,notes:'',paid:false,payDate:''});
    else if(e.active&&r&&!r.paid){r.name=e.name;r.idNo=e.idNo;if(old&&r3(r.amount)===r3(old.fee))r.amount=e.fee||0}
    else if(!e.active&&r&&!r.paid)l.splice(i,1);
  });
  return uniq(done).join('، ');
}

  const prev=Object.keys(DB.payroll).filter(k=>k<m).sort().pop();

  const rows=DB.emps.filter(e=>e.active).map(e=>{const p=pr.find(r=>r.emp===e.id);return{...snap(e),days:30,hours:0,basic:e.basic||0,extra:0,ded:0,ss:e.ss||(p?p.ss:0)||0,paid:false}});
  DB.payroll[m]={rows,created:Date.now()};save();
}

/* ---------- التقارير ---------- */
function monthSummary(m){
  const work=workIn(m).reduce((s,w)=>s+(+w.received||0),0),prof=profTot(m).paid;
  const sal=payTot(m).net,ex=expIn(m).reduce((s,x)=>s+(+x.amount||0),0);
  return{work,prof,inc:work+prof,sal,ex,out:sal+ex,net:work+prof-sal-ex};
}
function years(){const s=new Set([curMonth().slice(0,4)]);[...Object.keys(DB.payroll),...Object.keys(DB.profits),...DB.expenses.map(x=>x.date),...DB.works.map(x=>x.date)].forEach(d=>d&&s.add(d.slice(0,4)));return[...s].sort().reverse()}

  const ys=years();if(!RY||!ys.includes(RY))RY=ys[0];
  const rs=MONTHS.map((n,i)=>({m:RY+'-'+pad(i+1),n,...monthSummary(RY+'-'+pad(i+1))}));
  const T=rs.reduce((a,r)=>{['work','prof','inc','sal','ex','out','net'].forEach(k=>a[k]=(a[k]||0)+r[k]);return a},{});
  const mx=Math.max(1,...rs.map(r=>Math.max(r.inc,r.out)));
  return `<div class="card"><div class="row"><h2 style="margin:0">التقرير السنوي</h2><select onchange="RY=this.value;render()">${ys.map(y=>`<option ${y===RY?'selected':''}>${y}</option>`).join('')}</select><span class="sp"></span><button class="sm" onclick="printRep()">🖨 طباعة</button><button class="sm" onclick="internalExport()">⬇ تصدير كل البيانات (Excel)</button></div>

   <div class="tile"><div class="k">إجمالي المصروف</div><div class="v">${money(T.out)}</div><div class="s">رواتب ${money(T.sal)} + مصروفات ${money(T.ex)}</div></div>
   <div class="tile"><div class="k">الصافي</div><div class="v" style="color:${T.net<0?'var(--bad)':'var(--ok)'}">${money(T.net)}</div><div class="s">ر.ع</div></div></div>
  <div class="tw"><table><thead><tr><th>الشهر</th><th class="n">الأعمال المحصلة</th><th class="n">الأرباح المحصلة</th><th class="n">الرواتب</th><th class="n">المصروفات</th><th class="n">الصافي</th><th style="width:30%">دخل / مصروف</th></tr></thead>
  <tbody>${rs.map(r=>`<tr><td>${r.n}</td><td class="n">${money(r.work)}</td><td class="n">${money(r.prof)}</td><td class="n">${money(r.sal)}</td><td class="n">${money(r.ex)}</td><td class="n" style="color:${r.net<0?'var(--bad)':'inherit'}">${money(r.net)}</td>
   <td><div class="bar" style="width:${r.inc/mx*100}%;margin-bottom:2px"></div><div class="bar e" style="width:${r.out/mx*100}%"></div></td></tr>`).join('')}</tbody>
  <tfoot><tr><td>الإجمالي</td><td class="n">${money(T.work)}</td><td class="n">${money(T.prof)}</td><td class="n">${money(T.sal)}</td><td class="n">${money(T.ex)}</td><td class="n">${money(T.net)}</td><td></td></tr></tfoot></table></div>

}

/* ================= الفواتير وسندات القبض والصرف =================
   كل دفعة في التطبيق (مصروف، راتب مصروف، أرباح مدفوعة، دفعة عمل) لها سند برقم متسلسل يُنشأ تلقائياً.
   syncInvoices() تقرأ المدفوعات من مصادرها في كل عرض: تنشئ سنداً لكل دفعة جديدة، وتحدّث بياناته إن عُدّلت الدفعة،
   وتعلّمه «ملغى» إن حُذفت الدفعة (الرقم لا يُعاد استخدامه). فاتورة العمل للعميل تُنشأ عند الطلب. */
const INVT={out:'سند صرف',in:'سند قبض',inv:'فاتورة'},INVP={out:'ص',in:'ق',inv:'ف'};
const salKey=(m,r)=>`sal:${m}:${r.emp||r.name}`;
const crFromDocs=()=>((DB.docs||[]).find(x=>x.type==='السجل التجاري'&&!x.closed&&x.number)||{}).number||'';
function workPays(w,firstDate){
  w.pays=w.pays||[];const sum=w.pays.reduce((s,p)=>s+(+p.amount||0),0),rec=r3(w.received);
  if(rec>sum+0.0005)w.pays.push({id:uid(),date:firstDate||today(),amount:r3(rec-sum)});
  else if(rec<sum-0.0005){let over=r3(sum-rec);for(let i=w.pays.length-1;i>=0&&over>0;i--){const p=w.pays[i],c=Math.min(p.amount,over);p.amount=r3(p.amount-c);over=r3(over-c);if(!p.amount)w.pays.splice(i,1)}}
}
function paySources(){
  const S=[];
  DB.expenses.forEach(x=>S.push({key:'exp:'+x.id,kind:'out',date:x.date,party:x.recipient||'—',desc:[x.type,x.notes].filter(Boolean).join(' — '),amount:r3(x.amount),method:'نقداً',by:x.payer||''}));
  Object.keys(DB.payroll).forEach(m=>DB.payroll[m].rows.forEach(r=>{if(r.paid)S.push({key:salKey(m,r),kind:'out',date:r.payDate||m+'-28',party:r.name,
    desc:`راتب شهر ${mName(m)} — ${r.days} يوم عمل`,amount:net(r),method:'تحويل بنكي',
    sal:{m,bank:r.bank,acct:r.acct,basic:r3(r.basic),extra:r3(r.extra),ded:r3(r.ded),ss:r3(r.ss),hours:+r.hours||0}})}));
  Object.keys(DB.profits).forEach(m=>DB.profits[m].forEach(r=>{if(r.paid)S.push({key:`prof:${m}:${r.id}`,kind:'in',date:r.payDate||m+'-01',party:r.name,
    desc:`المبلغ الشهري — ${mName(m)}${r.notes?' — '+r.notes:''}`,amount:r3(r.amount),method:'نقداً'})}));
  DB.works.forEach(w=>{
    if(!w.pays&&+w.received>0)w.pays=[{id:uid(),date:w.date||today(),amount:r3(w.received)}];
    (w.pays||[]).forEach((p,i)=>S.push({key:'wpay:'+p.id,kind:'in',date:p.date,party:w.client||'—',desc:`دفعة ${i+1} عن: ${w.type}${w.notes?' — '+w.notes:''}`,amount:r3(p.amount),method:'نقداً',work:w.id}));
    if((DB.invoices||[]).some(v=>v.key==='winv:'+w.id))S.push({key:'winv:'+w.id,kind:'inv',date:w.date,party:w.client||'—',desc:w.type+(w.notes?' — '+w.notes:''),amount:r3(w.value),method:'',work:w.id,
      wk:{value:r3(w.value),received:r3(w.received),status:w.status}});
  });
  return S;
}
const FIELDS=['date','party','desc','amount','by','sal','work','wk'];
function syncInvoices(){
  if(!DB)return;DB.invoices=DB.invoices||[];DB.invSeq=DB.invSeq||{out:0,in:0,inv:0};
  const S=paySources(),seen=new Set(),byKey=new Map(DB.invoices.map(v=>[v.key,v]));let ch=false;const fresh=[];
  S.forEach(s=>{seen.add(s.key);const v=byKey.get(s.key);
    if(!v){fresh.push(s);return}
    FIELDS.forEach(f=>{const a=JSON.stringify(v[f]??null),b=JSON.stringify(s[f]??null);if(a!==b){v[f]=s[f];ch=true}});
    if(v.void){v.void=false;ch=true}});
  DB.invoices.forEach(v=>{if(!seen.has(v.key)&&!v.void){v.void=true;v.voidDate=today();ch=true}});
  fresh.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(s=>{const n=++DB.invSeq[s.kind];
    DB.invoices.push({id:uid(),no:INVP[s.kind]+'-'+String(n).padStart(4,'0'),...s,created:Date.now()});ch=true});
  if(ch)save();
}
function workInvoice(id){
  syncInvoices();const key='winv:'+id;
  if(!DB.invoices.some(v=>v.key===key)){const w=DB.works.find(x=>x.id===id);const n=++DB.invSeq.inv;
    DB.invoices.push({id:uid(),no:'ف-'+String(n).padStart(4,'0'),key,kind:'inv',date:w.date||today(),party:w.client||'—',desc:w.type,amount:r3(w.value),method:'',work:id,created:Date.now()});syncInvoices();save()}
  invOpen(key);
}
function workReceipts(id){
  syncInvoices();const w=DB.works.find(x=>x.id===id),l=(w.pays||[]).map(p=>DB.invoices.find(v=>v.key==='wpay:'+p.id)).filter(Boolean);
  dlg('سندات القبض — '+w.type,`<div class="tw"><table><thead><tr><th>الرقم</th><th>التاريخ</th><th class="n">المبلغ</th><th></th></tr></thead><tbody>${l.map(v=>`<tr><td><b>${v.no}</b></td><td>${esc(v.date)}</td><td class="n">${money(v.amount)}</td><td><button class="sm" onclick="invOpen('${v.key}')">🧾 عرض</button></td></tr>`).join('')}</tbody></table></div>`,[['إغلاق','p']]);
}

/* ---- المبلغ كتابةً (ريال عماني وبيسة) ---- */
function arWords(n){
  n=Math.floor(n);if(!n)return'صفر';
  const O=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const TN=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const HN=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const u1000=x=>{const h=Math.floor(x/100),r=x%100,p=[];if(h)p.push(HN[h]);if(r){if(r<20)p.push(O[r]);else{const u=r%10,t=Math.floor(r/10);p.push(u?O[u]+' و'+TN[t]:TN[t])}}return p.join(' و')};
  const grp=(x,one,two,few,many)=>x===1?one:x===2?two:x<=10?u1000(x)+' '+few:u1000(x)+' '+many;
  const p=[],b=Math.floor(n/1e9),m=Math.floor(n/1e6)%1000,k=Math.floor(n/1000)%1000,r=n%1000;
  if(b)p.push(grp(b,'مليار','ملياران','مليارات','مليار'));
  if(m)p.push(grp(m,'مليون','مليونان','ملايين',m%100>=11?'مليوناً':'مليون'));
  if(k)p.push(grp(k,'ألف','ألفان','آلاف',k%100>=11?'ألفاً':'ألف'));
  if(r)p.push(u1000(r));
  return p.join(' و');
}
function amountWords(x){
  x=r3(x);const ri=Math.floor(x+1e-9),bz=Math.round((x-ri)*1000);
  const unit=(n,one,two,few,many)=>{if(n===1)return one+' واحد';if(n===2)return two;const r=n%100;return arWords(n)+' '+(r>=3&&r<=10?few:r>=11?many:one)};
  const p=[];if(ri)p.push(unit(ri,'ريال عماني','ريالان عمانيان','ريالات عمانية','ريالاً عمانياً'));
  if(bz)p.push(bz===1?'بيسة واحدة':bz===2?'بيستان':arWords(bz)+' بيسة');
  return 'فقط '+(p.join(' و')||'صفر ريال')+' لا غير';
}

/* ---- شكل الفاتورة (HTML للعرض والطباعة) ---- */
function invParts(v){
  const s=DB.settings,cr=s.coCR||crFromDocs();
  const who=v.kind==='out'?'صرفنا إلى السيد/ة':v.kind==='in'?'استلمنا من السيد/ة':'فاتورة إلى';
  const rows=[[who,v.party]];
  if(v.kind==='inv'){const k=v.wk||{value:v.amount,received:0};rows.push(['البيان',v.desc]);rows.push(['قيمة العمل',money(k.value)+' ر.ع']);rows.push(['المدفوع',money(k.received)+' ر.ع']);rows.push(['المتبقي',money(k.value-k.received)+' ر.ع']);rows.push(['المبلغ كتابةً',amountWords(k.value)])}
  else{rows.push(['مبلغاً وقدره',money(v.amount)+' ر.ع']);rows.push(['المبلغ كتابةً',amountWords(v.amount)]);rows.push(['وذلك عن',v.desc]);
    if(v.sal)rows.push(['تفاصيل الراتب',`الأساسي ${money(v.sal.basic)}${v.sal.extra?' + إضافي '+money(v.sal.extra):''}${v.sal.ded?' − خصم '+money(v.sal.ded):''}${v.sal.ss?' − تأمينات '+money(v.sal.ss):''} = ${money(v.amount)}`]);
    rows.push(['طريقة الدفع',(v.methodX||v.method)+(v.sal&&(v.methodX||v.method)==='تحويل بنكي'?` — ${v.sal.bank} / ${v.sal.acct}`:'')]);
    if(v.by)rows.push(['دفعها',v.by])}
  if(v.note)rows.push(['ملاحظات',v.note]);
  const sig=v.kind==='out'?['توقيع المستلم','المحاسب'+(s.signer?' — '+s.signer:''),'الختم']:v.kind==='in'?['توقيع الدافع','المستلم'+(s.signer?' — '+s.signer:''),'الختم']:['المحاسب'+(s.signer?' — '+s.signer:''),'الختم'];
  const foot=[s.coAddr,s.coPhone?'هاتف: '+s.coPhone:'',s.coEmail].filter(Boolean).join('  •  ');
  return{title:INVT[v.kind],rows,sig,cr,foot};
}

/* ---- صورة PNG للفاتورة (للمشاركة على واتساب) ---- */
async function invPNG(v){
  const s=DB.settings,P=invParts(v),G='#2f6b4f',W=1100,F='Tahoma, Arial, sans-serif';
  const c=document.createElement('canvas'),x=c.getContext('2d');

/* فحص الكشف قبل التنزيل — الأخطاء التي تجعل موقع البنك يرفض الملف */
function bankCheck(p){
  const errs=[];
  p.rows.forEach((r,i)=>{
    const w=`${i+1}. ${r.name||'(بدون اسم)'}: `;
    if(!r.name)errs.push(w+'الاسم فارغ');
    else if(/[^\x20-\x7e]/.test(r.name))errs.push(w+'الاسم فيه حروف غير إنجليزية — البنك يقبل الاسم بالإنجليزية');
    if(!String(r.idNo||'').trim())errs.push(w+'رقم الهوية فارغ');
    else if(/civil/i.test(r.idType)&&!/^\d+$/.test(String(r.idNo).trim()))errs.push(w+'رقم الهوية المدنية يجب أن يكون أرقاماً فقط');
    if(!String(r.bank||'').trim())errs.push(w+'اسم البنك المستلم فارغ');
    if(!/^\d+$/.test(String(r.acct||'').trim()))errs.push(w+'رقم الحساب فارغ أو فيه رموز/مسافات');
    else if(String(r.acct).trim().length>15)errs.push(w+'رقم الحساب أطول من 15 رقماً — راجعه');
    if(DB.settings.bankType!=='xlsx'&&DB.settings.csvLayout!=='old'&&!bicOf(r.bank,r.bic))errs.push(w+'رمز البنك BIC غير معروف — اكتبه في بيانات العامل');
    if(!(+r.basic>0))errs.push(w+'الراتب الأساسي صفر');
    if(!(net(r)>0))errs.push(w+'صافي الراتب صفر أو سالب');
  });
  const ids=p.rows.map(r=>String(r.acct||'').trim()).filter(Boolean);
  ids.forEach((a,i)=>{if(ids.indexOf(a)!==i)errs.push(`رقم الحساب ${a} مكرر في الكشف`)});
  return errs;
}
function bankExport(m,force){
  const p=DB.payroll[m];if(!p||!p.rows.length)return toast('الكشف فارغ');

    if(errs.length)return dlg('تنبيه قبل تنزيل ملف البنك',`<div class="note">قد يرفض البنك الملف بسبب ما يلي — صحّحه من «العمال» ثم «تحديث بيانات العمال» في الكشف:</div><ul>${errs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`,
      [['إلغاء','p'],['تنزيل على أي حال','',()=>{bankExport(m,true)}]]);

      [['متابعة التنزيل','p',()=>{DB.settings.dedOk=1;save();bankExport(m,true)}],['إلغاء']]);

    DB.emps.forEach((e,i)=>em.push({cells:[I(i+1),T(e.name),T(e.nameAr),T(e.profession),T(e.nationality),T(e.idType),ID(e.idNo),...DOCS.map(([k])=>T((e.exp||{})[k])),T(e.bank),ID(e.acct),N(e.basic),N(e.fee),T(e.phone),T(e.active?'نشط':'موقوف'),T(e.notes)]}));
    const dc=[H(['ت','الوثيقة','الرقم','التفاصيل','الجهة المصدرة','خاصة بعامل','تاريخ الإصدار','تاريخ الانتهاء','الحالة','مبلغ التجديد','مجموع ما صُرف','ملاحظات'])];
    (DB.docs||[]).forEach((x,i)=>{const e=x.emp&&emp(x.emp),n=daysTo(x.expiry);dc.push({cells:[I(i+1),T(x.type),T(x.number),T(x.details),T(x.issuer),T(e?e.name:''),T(x.issue),T(x.expiry),T(x.closed?'ملغاة':n==null?'':leftTxt(n)),N(x.amount),N((x.history||[]).reduce((s,h)=>s+(+h.cost||0),0)),T(x.notes)]})});
    const iv=[H(['الرقم','النوع','التاريخ','الجهة','البيان','المبلغ','طريقة الدفع','الحالة'])];
    [...(DB.invoices||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.no.localeCompare(b.no)).forEach(v=>iv.push({cells:[T(v.no),T(INVT[v.kind]),T(v.date),T(v.party),T(v.desc),N(v.amount),T(v.method),T(v.void?'ملغاة':'سارية')]}));
    sh.push({name:'الفواتير',freeze:1,cols:[[1,4,15],[5,5,40],[6,8,14]],rows:iv});
    sh.splice(1,0,{name:'الوثائق',freeze:1,cols:[[1,1,5],[2,3,16],[4,4,34],[5,12,15]],rows:dc});
    sh.splice(1,0,{name:'العمال',freeze:1,cols:[[1,1,5],[2,2,26],[3,19,15]],rows:em});
  }
  download(buildXlsx(sh,{styles:IN_STYLES}),m?`${DB.settings.company} - كشف داخلي ${m}.xlsx`:`${DB.settings.company} - كل البيانات ${today()}.xlsx`);
}

/* ================= استيراد ملف رواتب بنكي ================= */
async function unzip(buf){
  const u=new Uint8Array(buf),v=new DataView(buf),out={},dec=new TextDecoder();
  let e=u.length-22;while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('ليس ملف xlsx');
  let p=v.getUint32(e+16,true);const cnt=v.getUint16(e+10,true);
  for(let k=0;k<cnt;k++){
    const meth=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true);
    const name=dec.decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    const ds=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true),raw=u.subarray(ds,ds+cs);
    out[name]=async()=>{if(meth===0)return dec.decode(raw);const s=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return dec.decode(await new Response(s).arrayBuffer())};
  }
  return out;
}
async function importBank(f){
  try{
    let grid=[];
    if(/\.csv$/i.test(f.name)){
      const txt=(await f.text()).replace(/^\uFEFF/,'');let row=[],cur='',qt=false;
      for(let i=0;i<txt.length;i++){const ch=txt[i];
        if(qt){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else qt=false}else cur+=ch}
        else if(ch==='"')qt=true;else if(ch===','){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';grid.push(row);row=[]}else cur+=ch}
      if(cur||row.length){row.push(cur);grid.push(row)}
    }else{
    const z=await unzip(await f.arrayBuffer()),P=new DOMParser();
    const ss=z['xl/sharedStrings.xml']?[...P.parseFromString(await z['xl/sharedStrings.xml'](),'application/xml').getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
    const doc=P.parseFromString(await z['xl/worksheets/sheet1.xml'](),'application/xml');
    [...doc.getElementsByTagName('c')].forEach(c=>{const ref=c.getAttribute('r'),m=ref.match(/^([A-Z]+)(\d+)$/);let col=0;for(const ch of m[1])col=col*26+ch.charCodeAt(0)-64;
      const t=c.getAttribute('t'),vEl=c.getElementsByTagName('v')[0],isEl=c.getElementsByTagName('is')[0];
      let val=t==='s'?ss[+vEl.textContent]:t==='inlineStr'?(isEl?isEl.textContent:''):vEl?vEl.textContent:'';
      (grid[+m[2]-1]=grid[+m[2]-1]||[])[col-1]=val});
    }
    const head=(grid[0]||[]).map(h=>String(h||'').trim().toLowerCase());
    const isW=head.includes('employee id type');
    const WMAP={1:3,2:0,3:1,5:5,6:7,7:10,8:9,9:11,10:12,11:13};
    const ix=k=>{if(isW){return k===4?-1:WMAP[k]}const i=head.indexOf(BANK_HEAD[k].toLowerCase());return i<0?k:i};
    const data=grid.slice(1).filter(r=>r&&r[ix(1)]);
    const bicCol=isW?4:-1;
    if(!data.length)throw new Error('لا توجد صفوف عمال في الملف');
    dlg('استيراد ملف رواتب',`<div class="info">وُجد ${data.length} عامل في الملف «${esc(f.name)}».</div><div class="fg"><label class="full">إلى كشف شهر<input type="month" name="m" value="${curMonth()}"></label></div>
     <div class="mute" style="font-size:13px">العمال غير الموجودين يُضافون إلى «العمال» تلقائياً. إذا كان للشهر كشف سابق فسيُستبدل.</div>`,
    [['استيراد','p',()=>{
      const m=fv('m');if(!m)return false;if(DB.payroll[m]&&!confirm('كشف '+mName(m)+' موجود — استبداله؟'))return false;
      const g=(r,k)=>String(r[ix(k)]??'').trim(),num=(r,k)=>+g(r,k)||0;let added=0;
      const rows=data.map(r=>{
        const it=g(r,2),bic=bicCol>=0?String(r[bicCol]??'').trim().toUpperCase():'';
        const o={name:g(r,1),idType:it==='C'?'Civil ID':it==='P'?'Passport':(it||'Civil ID'),idNo:g(r,3),bank:bicCol>=0?((DB.emps.find(x=>bicOf(x.bank,x.bic)===bic)||{}).bank||(bic==='BSHROMRU'?'Sohar International':bic)):g(r,4),acct:/^\d+$/.test(g(r,5))?g(r,5).replace(/^0+(?=\d)/,''):g(r,5)};
        let e=DB.emps.find(x=>(o.idNo&&x.idNo===o.idNo)||(o.acct&&x.acct===o.acct)||x.name===o.name);
        if(!e){e={id:uid(),...o,basic:r3(num(r,8)),ss:Math.abs(r3(num(r,11))),hourRate:0,fee:0,phone:'',active:true,notes:''};DB.emps.push(e);added++}
        return{...snap(e),...o,days:num(r,6),hours:num(r,7),basic:r3(num(r,8)),extra:r3(num(r,9)),ded:Math.abs(r3(num(r,10))),ss:Math.abs(r3(num(r,11))),paid:false};
      });
      DB.payroll[m]={rows,created:Date.now()};PM=m;TAB='pay';save();render();toast(`تم الاستيراد — ${rows.length} عامل${added?'، أُضيف '+added+' عامل جديد':''}`);
    }],['إلغاء']]);
  }catch(e){alert('تعذر قراءة الملف: '+(e.message||e))}
}

function mobileInit(){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  /* ملف مُشارك من واتساب ← «بيلسان الريف» */
  if(/[?&]shared=1/.test(location.search)&&'caches' in window){
    history.replaceState(null,'',location.pathname);
    caches.open('bilsan-share').then(async c=>{const k=new URL('shared-file',location.origin+location.pathname).href,r=await c.match(k);
      if(r){const t=await r.text();await c.delete(k);applyData(t)}}).catch(()=>{});
  }
}
